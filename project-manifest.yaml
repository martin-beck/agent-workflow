schema: 1
project:
  name: agent-workflow
  title: Agent Workflow
  kind: umbrella
  organization: martin-beck
  discovery_rule: "All public repositories named agent-workflow-* are family candidates; only entries below are pipeline inputs."

# Product source remains in these repositories. Their state repositories are
# coordination authorities and are intentionally not vendored here.
children:
  - name: agent-workflow-coordinator
    title: Agent Workflow Coordinator
    repository: martin-beck/agent-workflow-coordinator
    url: https://github.com/martin-beck/agent-workflow-coordinator
    state_repository: martin-beck/agent-workflow-coordinator-state
    owns:
      - task lifecycle and claims
      - dependencies, leases, revisions, and durable coordination
      - persistence of accepted TUI outcomes into AR state and revision history
    consult_when: "Any task is claimed, updated, released, reconciled, or coordinated."

  - name: agent-workflow-quality
    title: Agent Workflow Quality
    repository: martin-beck/agent-workflow-quality
    url: https://github.com/martin-beck/agent-workflow-quality
    state_repository: martin-beck/agent-workflow-quality-state
    owns:
      - quality requirements and profiles
      - gates, adapters, and evidence contracts
    consult_when: "A change has quality, testing, assurance, evidence, release, or policy impact."

  - name: agent-workflow-guidance
    title: Agent Workflow Guidance
    repository: martin-beck/agent-workflow-guidance
    url: https://github.com/martin-beck/agent-workflow-guidance
    state_repository: martin-beck/agent-workflow-guidance-state
    owns:
      - oracle escalation and alternatives
      - durable decisions and reusable guidance
    consult_when: "Intent is materially ambiguous, trade-offs need a decision, or dependent work may be constrained."

  - name: agent-workflow-ui
    title: Agent Workflow UI
    repository: martin-beck/agent-workflow-ui
    url: https://github.com/martin-beck/agent-workflow-ui
    state_repository: martin-beck/agent-workflow-ui-state
    owns:
      - interactive terminal rendering and input handling
      - AR-bound discussion, decision, and conflict-reconciliation sessions
      - Coordinator, AWG, and AWQ client adapters
    consult_when: "An AR requires human interaction, a decision packet must be rendered, or a TUI response must return to an AR; use the versioned Coordinator/TUI bridge for trigger and persistence mapping."

pipeline:
  required_start: [manifest, all_child_instructions, applicable_child_state]
  order:
    - coordinator: establish task, owner, dependencies, and revision
    - quality: determine applicable requirements, gates, and evidence
    - guidance: resolve material ambiguity or trade-offs before implementation
    - ui: render and collect revision-bound interaction through child adapters
    - children: execute owner-specific contracts and checks
    - coordinator: record durable progress and completion
  future_child_rule: "Add a distinct child entry here after reviewing ownership overlap and its public instructions."

# These are the reviewed, mutually compatible inputs for the current bridge.
# Source commits are immutable audit anchors; releases are the install/runtime
# selectors used by agents.  Update this block only with a compatibility PR.
compatibility:
  bridge_contract_version: "1.0"
  guidance_trigger_schema_version: "1.0"
  ui_release:
    repository: martin-beck/agent-workflow-ui
    release: v0.4.5
    commit: aea90809331fc65d0a4f93d532b8f0a527704c2e
  coordinator_release:
    repository: martin-beck/agent-workflow-coordinator
    release: v0.3.22
    commit: da7faa08a40513254179429c9c6d5c43e980ea48
  guidance_source:
    repository: martin-beck/agent-workflow-guidance
    release: v0.1.2
    commit: 4cc6fdebed62cfb8d2f05224d8438f2e0da6e035
  quality_source:
    repository: martin-beck/agent-workflow-quality
    release: v0.35.0-bridge.1
    commit: 8ec460ec99baf8061d1644a2532b5b9beb47b75b
  required_contracts:
    - repository: martin-beck/agent-workflow-guidance
      path: schema/human-decision-trigger.schema.json
      schema_version: "1.0"
    - repository: martin-beck/agent-workflow-guidance
      path: schema/decision-request.schema.json
      schema_version: "0.2"
    - repository: martin-beck/agent-workflow-guidance
      path: schema/agent-decision-routing.schema.json
      schema_version: "1.0"
    - repository: martin-beck/agent-workflow-ui
      path: schemas/coordinator-tui-bridge.schema.json
      schema_version: "1.0"
