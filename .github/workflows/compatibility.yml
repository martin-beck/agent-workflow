name: Cross-project compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.x'
      - name: Validate reviewed compatibility lock
        run: python3 tools/check_compatibility.py --report compatibility-report.json
      - name: Run hostile-input tests
        run: python3 tests/test_compatibility.py -v
      - name: Publish compatibility report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: compatibility-report
          path: compatibility-report.json
          if-no-files-found: error
      - name: Verify immutable source pins exist
        shell: bash
        run: |
          set -euo pipefail
          while read -r repository commit; do
            curl --fail --silent --show-error --location \
              "https://api.github.com/repos/${repository}/commits/${commit}" >/dev/null
          done <<'PINS'
          martin-beck/agent-workflow-ui 1c0fe3a4a1fd69a5166eeb628ad865d53122de0d
          martin-beck/agent-workflow-coordinator da7faa08a40513254179429c9c6d5c43e980ea48
          martin-beck/agent-workflow-guidance 4cc6fdebed62cfb8d2f05224d8438f2e0da6e035
          martin-beck/agent-workflow-quality 8ec460ec99baf8061d1644a2532b5b9beb47b75b
          martin-beck/agent-workflow-runtime 79b0c25af69c9bd9d8551c8065fb1488fb36ccd5
          PINS
      - name: Verify release tags used by the lock
        shell: bash
        run: |
          set -euo pipefail
          tag_commit() {
            local repository=$1 tag=$2 expected=$3 actual
            actual=$(git ls-remote "https://github.com/${repository}.git" "refs/tags/${tag}^{}" | awk '{print $1}')
            test -n "${actual}" || actual=$(git ls-remote "https://github.com/${repository}.git" "refs/tags/${tag}" | awk '{print $1}')
            test "${actual}" = "${expected}"
          }
          tag_commit martin-beck/agent-workflow-ui v0.6.3 1c0fe3a4a1fd69a5166eeb628ad865d53122de0d
          tag_commit martin-beck/agent-workflow-coordinator v0.3.22 da7faa08a40513254179429c9c6d5c43e980ea48
          tag_commit martin-beck/agent-workflow-guidance v0.1.2 4cc6fdebed62cfb8d2f05224d8438f2e0da6e035
          tag_commit martin-beck/agent-workflow-quality v0.35.0-bridge.1 8ec460ec99baf8061d1644a2532b5b9beb47b75b
          tag_commit martin-beck/agent-workflow-runtime v0.1.8 79b0c25af69c9bd9d8551c8065fb1488fb36ccd5
