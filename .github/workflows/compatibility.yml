name: Cross-project compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate reviewed compatibility lock
        run: python3 tools/check_compatibility.py
      - name: Verify immutable source pins exist
        shell: bash
        run: |
          set -euo pipefail
          while read -r repository commit; do
            curl --fail --silent --show-error --location \
              "https://api.github.com/repos/${repository}/commits/${commit}" >/dev/null
          done <<'PINS'
          martin-beck/agent-workflow-tui 5f68f8e86586a4c8036a180eb35c42fab82df843
          martin-beck/agent-workflow-coordinator 2666c9d7a56ce02340e1b4b09344a227936a34cf
          martin-beck/agent-workflow-guidance 9b044ebc930751ba23c60ecd7d8f7c30ca631609
          martin-beck/agent-workflow-quality 8ec460ec99baf8061d1644a2532b5b9beb47b75b
          PINS
      - name: Verify release tags used by the lock
        shell: bash
        run: |
          set -euo pipefail
          tag_commit() {
            local repository=$1 tag=$2 expected=$3 actual
            actual=$(git ls-remote "https://github.com/${repository}.git" "refs/tags/${tag}^{}" | awk '{print $1}')
            test -n "${actual}" || actual=$(git ls-remote "https://github.com/${repository}.git" "refs/tags/${tag}" | awk '{print $1}')
            test "${actual}" = "${expected}"
          }
          tag_commit martin-beck/agent-workflow-tui v0.1.2 5f68f8e86586a4c8036a180eb35c42fab82df843
          tag_commit martin-beck/agent-workflow-coordinator v0.3.14 2666c9d7a56ce02340e1b4b09344a227936a34cf
