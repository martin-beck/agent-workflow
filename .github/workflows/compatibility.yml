name: Cross-project compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate reviewed compatibility lock
        run: python3 tools/check_compatibility.py
      - name: Verify immutable source pins exist
        shell: bash
        run: |
          set -euo pipefail
          while read -r repository commit; do
            curl --fail --silent --show-error --location \
              "https://api.github.com/repos/${repository}/commits/${commit}" >/dev/null
          done <<'PINS'
          martin-beck/agent-workflow-ui f89103b70d18642bef9e785214eb5ea790a53627
          martin-beck/agent-workflow-coordinator da7faa08a40513254179429c9c6d5c43e980ea48
          martin-beck/agent-workflow-guidance 4cc6fdebed62cfb8d2f05224d8438f2e0da6e035
          martin-beck/agent-workflow-quality 8ec460ec99baf8061d1644a2532b5b9beb47b75b
          martin-beck/agent-workflow-runtime 76c34632a6a9426c1c3b450eb9f6f3577d9fb808
          PINS
      - name: Verify release tags used by the lock
        shell: bash
        run: |
          set -euo pipefail
          tag_commit() {
            local repository=$1 tag=$2 expected=$3 actual
            actual=$(git ls-remote "https://github.com/${repository}.git" "refs/tags/${tag}^{}" | awk '{print $1}')
            test -n "${actual}" || actual=$(git ls-remote "https://github.com/${repository}.git" "refs/tags/${tag}" | awk '{print $1}')
            test "${actual}" = "${expected}"
          }
          tag_commit martin-beck/agent-workflow-ui v0.6.0 f89103b70d18642bef9e785214eb5ea790a53627
          tag_commit martin-beck/agent-workflow-coordinator v0.3.22 da7faa08a40513254179429c9c6d5c43e980ea48
          tag_commit martin-beck/agent-workflow-guidance v0.1.2 4cc6fdebed62cfb8d2f05224d8438f2e0da6e035
          tag_commit martin-beck/agent-workflow-quality v0.35.0-bridge.1 8ec460ec99baf8061d1644a2532b5b9beb47b75b
          tag_commit martin-beck/agent-workflow-runtime v0.1.3 76c34632a6a9426c1c3b450eb9f6f3577d9fb808
