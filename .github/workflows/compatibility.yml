name: Cross-project compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.x'
      - name: Run compatibility probe
        run: python3 tools/check_compatibility.py --report compatibility-report.json
      - name: Run hostile-input tests
        run: python3 tests/test_compatibility.py -v
      - name: Publish compatibility report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: compatibility-report
          path: compatibility-report.json
          if-no-files-found: error
